services:
  postgres:
    image: postgres:16-alpine
    
    environment:
      POSTGRES_DB: 
      POSTGRES_PASSWORD:
      POSTGRES_USER:
    
    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    networks:
      - monitoring_net
  
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: node24-monitoring-api:local
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5433
      DB_USER:
      DB_PASSWORD:
      DB_NAME: 